# The open pull requests whose head is a branch of that name, the 100 created most recently: a
# pull request based on the branch sits on the one from it in the same repository, which merges
# first. A fork's pull request from a branch of the same name is among them too, marked by
# `isCrossRepository`. It costs 1 point.
query PullsFromHead($owner: String!, $name: String!, $branch: String!) {
  rateLimit {
    cost
    limit
    remaining
    used
    resetAt
  }
  repository(owner: $owner, name: $name) {
    pullRequests(
      headRefName: $branch
      states: [OPEN]
      orderBy: { field: CREATED_AT, direction: DESC }
      first: 100
    ) {
      totalCount
      nodes {
        number
        baseRefName
        headRefName
        isCrossRepository
      }
    }
  }
}
