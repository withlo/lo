# What a stack's tree shows of its layers (`docs/design.md`, "The stack tree") that the open pull
# request list doesn't keep current: each layer's review decision, checks and merge queue entry, and
# how many of its first 100 files the viewer has viewed. Also the branch each layer last moved from,
# whether GitHub moved it after that branch was deleted or someone changed its base, so the merged
# layer below can be looked up. Asked for by node ID, at most 100 at a time.
query StackLayers($ids: [ID!]!) {
  rateLimit {
    cost
    limit
    remaining
    used
    resetAt
  }
  nodes(ids: $ids) {
    __typename
    ... on PullRequest {
      id
      number
      state
      headRefOid
      reviewDecision
      statusCheckRollup {
        state
      }
      isInMergeQueue
      mergeQueueEntry {
        position
        state
      }
      files(first: 100) {
        totalCount
        nodes {
          viewerViewedState
        }
      }
      movedFrom: timelineItems(
        itemTypes: [AUTOMATIC_BASE_CHANGE_SUCCEEDED_EVENT, BASE_REF_CHANGED_EVENT]
        last: 1
      ) {
        nodes {
          __typename
          ... on AutomaticBaseChangeSucceededEvent {
            oldBase
          }
          ... on BaseRefChangedEvent {
            previousRefName
          }
        }
      }
    }
  }
}
