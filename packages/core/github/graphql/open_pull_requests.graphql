# A repository's open pull requests, with what finding stacks needs
# (`docs/design.md`, "Finding stacks"): their branches, recent commits and native stack membership,
# and the title and author a stack's tree shows. With them, the repository's default branch, and the
# pull requests merged that were updated most recently. Each layer's review, checks and queue state
# come from `StackLayers`, which keeps them current; here they'd be stale until the next push.
#
# A page at a time, newest first: Lo reads at most 1,000, and when a repository has more, the oldest
# are the ones to leave out. Creation time doesn't change while paging, unlike the time of the last
# update. Only the first page asks for merged pull requests ($merged is 0 after it). A page costs 1
# point: GitHub adds up the connections it may read, 142 here, and divides by 100.
query OpenPullRequests(
  $owner: String!
  $name: String!
  $first: Int!
  $after: String
  $merged: Int!
) {
  rateLimit {
    cost
    limit
    remaining
    used
    resetAt
  }
  repository(owner: $owner, name: $name) {
    defaultBranchRef {
      name
    }
    pullRequests(
      states: [OPEN]
      orderBy: { field: CREATED_AT, direction: DESC }
      first: $first
      after: $after
    ) {
      totalCount
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        id
        number
        title
        isDraft
        createdAt
        updatedAt
        author {
          __typename
          login
        }
        baseRefName
        baseRefOid
        baseRef {
          # The base branch's tip now, which baseRefOid, set when the head last moved, isn't. Null
          # once the branch is deleted.
          target {
            __typename
            oid
          }
          # The pattern of the branch protection rule that covers it, which people who can't
          # administer the repository see too, unlike its branchProtectionRules.
          refUpdateRule {
            pattern
          }
        }
        headRefName
        headRefOid
        headRef {
          refUpdateRule {
            pattern
          }
        }
        isCrossRepository
        headRepositoryOwner {
          __typename
          login
        }
        # Oldest first, so the last is the head.
        commits(last: 20) {
          nodes {
            commit {
              oid
            }
          }
        }
        stackEntry {
          position
          stack {
            number
            size
            baseRefName
          }
        }
      }
    }
    # The merged pull requests updated most recently. Their commits link the layers still open
    # above them once their head branch is deleted, when GitHub moves those layers to the branch
    # below. Updates after the merge, such as a bot's comment, can push one out of the window.
    mergedPullRequests: pullRequests(
      states: [MERGED]
      orderBy: { field: UPDATED_AT, direction: DESC }
      first: $merged
    ) {
      nodes {
        ...MergedPullRequestFields
      }
    }
  }
}

# What finding stacks reads of a merged pull request. `MergedPullRequests` reads the same.
fragment MergedPullRequestFields on PullRequest {
  number
  createdAt
  baseRefName
  baseRef {
    target {
      __typename
      oid
    }
    refUpdateRule {
      pattern
    }
  }
  headRefName
  headRefOid
  isCrossRepository
  commits(last: 20) {
    nodes {
      commit {
        oid
      }
    }
  }
  # Its head is in its base branch when it's this commit or one of its parents: after a merge
  # commit or a fast-forward, not a squash or a rebase.
  mergeCommit {
    oid
    parents(first: 2) {
      nodes {
        oid
      }
    }
  }
  stackEntry {
    position
    stack {
      number
    }
  }
}
