# electron-builder's settings for Lo, run from apps/desktop by `nx run desktop:package`.
#
# This makes a macOS zip for arm64, signed ad hoc: it holds no certificate, notarizes nothing and
# reads no secret. Gatekeeper doesn't trust such a signature. A zip downloaded in a browser is
# quarantined, so macOS blocks the app until it's allowed in System Settings > Privacy & Security >
# Open Anyway (macOS 15 and later no longer offer right-click > Open). A zip fetched with
# `gh run download` carries no quarantine flag and opens as it is.

appId: com.scornz.lo
productName: Lo
copyright: Copyright © 2026 Mike Scornavacca
artifactName: ${productName}-${version}-${arch}.${ext}

directories:
  output: release

# Only what electron-vite built. It bundles everything main and the window import, so the app needs
# no node_modules, and the dependencies in package.json are left out.
files:
  - dist/**
  - package.json
  - '!**/node_modules/**'
  # The licenses file goes outside the asar, below.
  - '!dist/licenses.txt'

# Beside the asar, in the app's resources, where the system can open them: the licenses of what Lo
# ships (scripts/notices.ts writes the file, and "Show licenses" opens it), and the icon that
# Linux's About panel shows. electron-builder adds Electron's license and Chromium's there itself.
extraResources:
  - from: dist/licenses.txt
    to: licenses.txt
  - from: ../../brand/Lo.iconset/icon_512x512.png
    to: icon.png

# Nothing here compiles native code.
npmRebuild: false

# Nothing is published from this build.
publish: null

mac:
  target:
    - target: zip
      arch: arm64
  category: public.app-category.developer-tools
  icon: ../../brand/Lo.icns
  # '-' signs ad hoc, even when the keychain holds a certificate.
  identity: '-'
  # The hardened runtime is on, with only the two entitlements that Lo can't start without (the
  # same file for the app and its helpers). allow-jit: V8 maps its code as executable, and without
  # it Lo dies at start, reserving memory for V8's code. disable-library-validation: an ad hoc signature has no
  # team, so library validation refuses Electron's framework as another signer's. A Developer ID
  # signature has one, and wouldn't need it. Neither WebAssembly, workers nor node:sqlite needs
  # allow-unsigned-executable-memory.
  hardenedRuntime: true
  entitlements: build/entitlements.plist
  entitlementsInherit: build/entitlements.plist
  notarize: false
  # Web links too, on the Mac alone, where link routers such as Finicky send pull requests' links
  # on to Lo. The Viewer role makes Lo a choice among the apps that open `http` and `https`, and
  # leaves the default browser as it is. A Linux desktop file has no such role: on a desktop with no
  # default browser set, a Lo registered for them could take every web link.
  protocols:
    - name: Web link
      schemes: [http, https]
      role: Viewer

# Fuses are switches in Electron's binary, flipped just before it's signed. These close what a
# process that can start Lo with arguments or an environment could use to run code in it: the
# debugger, NODE_OPTIONS and ELECTRON_RUN_AS_NODE. Lo loads its code only from the asar, whose
# contents Electron checks against a hash in Info.plist (on the Mac: Electron checks no hash on
# Linux), and its window is never served from file:.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  enableCookieEncryption: true
  grantFileProtocolExtraPrivileges: false

# Registers Lo for `lo://` links, everywhere, and on the Mac for web links too (`mac.protocols`).
protocols:
  - name: Lo link
    schemes: [lo]
    role: Viewer
