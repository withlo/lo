# Builds Lo from a version tag: for the Mac, a DMG and a zip for Apple silicon and for Intel, signed
# with the Developer ID, notarized and checked; for Linux, as a preview, a deb and an rpm for x64 and
# for arm64, each installed, started and checked. Then it drafts the GitHub release that holds
# them, with their checksums and notes GitHub writes from the merged pull requests. A maintainer
# reads the draft and publishes it; nothing here publishes a release.
#
# Pushing a tag v<version>, such as v0.1.0 or v0.1.0-rc.1, on a commit main holds, starts it.
# package.json's version stays 0.0.0, and the tag's is the one built in. The mac job is the only one
# that reads the signing secrets, and only in a tag's run, through the `release` environment, which
# waits for a maintainer's approval and takes only v* tags. The draft job, which can write the
# release, holds no signing secret and runs none of the repository's code.
#
# Started by hand (`gh workflow run release.yml --ref <branch or tag>`), or by a pull request that
# changes how Lo is packaged, it's a dry run: the same build as 0.0.0-dry.<run>, signed ad hoc with
# the ad hoc entitlements and checked as far as an ad hoc build can be, in no environment, reading
# no secret and drafting nothing. Its files are the run's `mac`, `linux-x64` and `linux-arm64`
# artifacts for 14 days. The Linux packages are never signed, so they're built the same either way.
#
# Publishing a release that isn't a prerelease, or making a prerelease a release, starts it again,
# for the cask job alone: it proposes the release's Homebrew cask, Casks/lo.rb, to
# withlo/homebrew-tap in a pull request, which the tap's own checks audit and install before a
# maintainer merges it.
name: release

on:
  push:
    tags: ['v*']
  # A draft published as a release, or a prerelease made a release; `published` would miss the
  # second, and fire for prereleases too.
  release:
    types: [released]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - apps/desktop/build/**
      - apps/desktop/package.json
      - scripts/check-linux.sh
      - scripts/check-package.sh
      - scripts/release/**

permissions:
  contents: read

# One run per ref at a time. A tag's run is never cancelled, so nothing it signed or notarized is
# left unchecked; a pull request's newer push cancels its older dry run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # nx.json turns both off too.
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'

jobs:
  # The version to build. A tag's run takes it from the tag, after scripts/release/version.sh checks
  # the tag and that main holds its commit, and so does a published release's, from its tag; a dry
  # run makes up its own.
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      # The whole history and every branch, so the script can tell whether main holds the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag and find the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = push ] || [ "$EVENT" = release ]; then
            found=$(sh scripts/release/version.sh "$GITHUB_REF" origin/main)
          else
            found=$(printf '%s\n' "version=0.0.0-dry.$GITHUB_RUN_NUMBER" prerelease=true)
          fi
          echo "$found"
          echo "$found" >> "$GITHUB_OUTPUT"

  # Builds both architectures in one run on Apple silicon, so one latest-mac.yml lists both, and
  # checks the Intel build under Rosetta.
  mac:
    name: mac
    needs: version
    if: github.event_name != 'release'
    runs-on: macos-26
    timeout-minutes: 90
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm, as package.json pins it, checked against the SHA-512 pnpm-lock.yaml holds for it,
      # then the dependencies from the lockfile alone, with the Node package.json pins. Nothing
      # comes from a cache: pnpm/setup restores and saves one of its own, whatever it's told.
      - name: Install pnpm and the dependencies
        run: |
          sh scripts/install-pnpm.sh "$RUNNER_TEMP/pnpm"
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pnpm/pnpm" install --frozen-lockfile

      - name: Install Rosetta
        run: |
          if arch -x86_64 /usr/bin/true 2> /dev/null; then
            echo "Rosetta is installed."
          else
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      # Built before any secret is in reach, so only electron-builder runs with them.
      - name: Build the app
        run: pnpm nx run desktop:build --output-style=static

      # electron-builder signs nothing without a certificate (the release config fails then), and
      # only warns when the notary key is missing, so a tag's run stops here if any secret is.
      - name: Check the signing secrets
        if: github.event_name == 'push'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          missing=
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD NOTARY_KEY_ID NOTARY_ISSUER_ID NOTARY_KEY_P8; do
            [ -n "$(printenv "$name")" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::The release environment has no$missing."
            exit 1
          fi

      # notarytool reads the App Store Connect key from a file, readable by this user alone.
      - name: Write the notary key
        if: github.event_name == 'push'
        env:
          NOTARY_KEY: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$NOTARY_KEY_P8" > "$NOTARY_KEY"

      # Signs the app and its helpers with the Developer ID, notarizes the app and staples it, then
      # makes the zips and the DMGs and signs the DMGs. CSC_LINK is the certificate, base64.
      - name: Package, sign and notarize
        if: github.event_name == 'push'
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.MACOS_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/notary.p8
          APPLE_API_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: pnpm run release "-c.extraMetadata.version=$VERSION"

      # electron-builder notarizes the app, not the DMGs. Each DMG is notarized as it is and not
      # stapled, since stapling would change a file latest-mac.yml already hashed; Gatekeeper finds
      # its ticket online. notarytool's answer says Invalid without failing, so it's read.
      - name: Notarize the DMGs
        if: github.event_name == 'push'
        env:
          NOTARY_KEY: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          for arch in arm64 x64; do
            dmg="apps/desktop/release/Lo-$VERSION-$arch.dmg"
            answer=$(xcrun notarytool submit "$dmg" --key "$NOTARY_KEY" --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" --wait --timeout 30m --output-format json) || true
            echo "$answer"
            id=$(printf '%s' "$answer" | jq -r '.id // empty' 2> /dev/null) || id=
            notarized=$(printf '%s' "$answer" | jq -r '.status // empty' 2> /dev/null) || notarized=
            if [ "$notarized" != Accepted ]; then
              if [ -n "$id" ]; then
                xcrun notarytool log "$id" --key "$NOTARY_KEY" --key-id "$NOTARY_KEY_ID" \
                  --issuer "$NOTARY_ISSUER_ID" || true
              fi
              echo "::error::Apple didn't notarize $dmg: ${notarized:-no answer}."
              exit 1
            fi
          done

      - name: Remove the notary key
        if: always()
        run: rm -f "$RUNNER_TEMP/notary.p8"

      # A dry run's build: with no certificate or notary key, the app is signed ad hoc with the ad
      # hoc entitlements, nothing is notarized, and the DMGs are left unsigned. electron-builder
      # signs nothing in a pull request's run unless CSC_FOR_PULL_REQUEST is set; an ad hoc
      # signature needs no secret.
      - name: Package ad hoc
        if: github.event_name != 'push'
        working-directory: apps/desktop
        env:
          CSC_FOR_PULL_REQUEST: 'true'
        run: >-
          pnpm run release "-c.extraMetadata.version=$VERSION" -c.mac.identity=-
          -c.mac.notarize=false -c.mac.entitlements=build/entitlements.plist
          -c.mac.entitlementsInherit=build/entitlements.plist -c.dmg.sign=false

      # Every file, so one run shows each failure. A dry run's are checked as an ad hoc build.
      - name: Check the DMGs and zips
        env:
          EVENT: ${{ github.event_name }}
        run: |
          failed=0
          for file in arm64.dmg arm64.zip x64.dmg x64.zip; do
            path="apps/desktop/release/Lo-$VERSION-$file"
            if [ "$EVENT" = push ]; then
              sh scripts/check-package.sh --release "$path" || failed=1
            else
              sh scripts/check-package.sh --release --ad-hoc "$path" || failed=1
            fi
          done
          exit "$failed"

      # latest-mac.yml tells electron-updater which file to download and the SHA-512 to check it
      # against, so it must be this version's and match every file as it's uploaded.
      - name: Check latest-mac.yml
        working-directory: apps/desktop/release
        run: |
          grep -qx "version: $VERSION" latest-mac.yml ||
            { echo "::error::latest-mac.yml isn't for $VERSION."; exit 1; }
          for file in arm64.dmg arm64.zip x64.dmg x64.zip; do
            name="Lo-$VERSION-$file"
            hash=$(openssl dgst -sha512 -binary "$name" | base64)
            grep -A 1 -x "  - url: $name" latest-mac.yml | grep -qxF "    sha512: $hash" ||
              { echo "::error::latest-mac.yml doesn't list $name with its SHA-512."; exit 1; }
            [ -s "$name.blockmap" ] || { echo "::error::There's no $name.blockmap."; exit 1; }
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac
          path: |
            apps/desktop/release/Lo-${{ env.VERSION }}-*.dmg
            apps/desktop/release/Lo-${{ env.VERSION }}-*.zip
            apps/desktop/release/Lo-${{ env.VERSION }}-*.blockmap
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  # Builds the deb and the rpm for one architecture of Linux on a runner of that architecture, so
  # that each one's latest-linux*.yml lists both, and installs and starts each there: the deb on the
  # runner, an Ubuntu where AppArmor stops user namespaces, and the rpm in a Fedora container.
  linux:
    name: linux (${{ matrix.arch }})
    needs: version
    if: github.event_name != 'release'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            deb: amd64
            rpm: x86_64
            updates: latest-linux.yml
          - arch: arm64
            runner: ubuntu-24.04-arm
            deb: arm64
            rpm: aarch64
            updates: latest-linux-arm64.yml
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
      DEB: Lo-${{ needs.version.outputs.version }}-${{ matrix.deb }}.deb
      RPM: Lo-${{ needs.version.outputs.version }}-${{ matrix.rpm }}.rpm
      UPDATES: ${{ matrix.updates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As the mac job installs them, from nothing cached.
      - name: Install pnpm and the dependencies
        run: |
          sh scripts/install-pnpm.sh "$RUNNER_TEMP/pnpm"
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pnpm/pnpm" install --frozen-lockfile

      # rpmbuild, which electron-builder makes the rpm with, and what check-linux.sh needs: rpm2cpio
      # and cpio to read the rpm, Xvfb to start Lo, and xwininfo to see its window.
      - name: Install the tools that package and check Lo
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends rpm rpm2cpio cpio xvfb x11-utils

      - name: Build the app
        run: pnpm nx run desktop:build --output-style=static

      - name: Package
        working-directory: apps/desktop
        run: pnpm run release:linux "-c.extraMetadata.version=$VERSION" "--$ARCH"

      # Both, so one run shows each failure.
      - name: Check the deb and the rpm
        run: |
          failed=0
          sh scripts/check-linux.sh "apps/desktop/release/$DEB" || failed=1
          sh scripts/check-linux.sh "apps/desktop/release/$RPM" || failed=1
          exit "$failed"

      # Lo on Linux only says a newer version is out, from this file, so it must be this version's
      # and list both packages with their SHA-512s.
      - name: Check ${{ matrix.updates }}
        working-directory: apps/desktop/release
        run: |
          grep -qx "version: $VERSION" "$UPDATES" ||
            { echo "::error::$UPDATES isn't for $VERSION."; exit 1; }
          for name in "$DEB" "$RPM"; do
            hash=$(openssl dgst -sha512 -binary "$name" | base64 -w 0)
            grep -A 1 -x "  - url: $name" "$UPDATES" | grep -qxF "    sha512: $hash" ||
              { echo "::error::$UPDATES doesn't list $name with its SHA-512."; exit 1; }
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            apps/desktop/release/${{ env.DEB }}
            apps/desktop/release/${{ env.RPM }}
            apps/desktop/release/${{ env.UPDATES }}
          if-no-files-found: error
          retention-days: 14

  # Drafts the release from the files the build jobs checked, with their SHA-256 checksums and
  # notes GitHub writes (.github/release.yml says what they leave out). A re-run replaces a draft's
  # files, and never touches a published release.
  draft:
    name: draft
    needs: [version, mac, linux]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac
          path: ${{ runner.temp }}/release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x64
          path: ${{ runner.temp }}/release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-arm64
          path: ${{ runner.temp }}/release

      - name: Write SHA256SUMS
        working-directory: ${{ runner.temp }}/release
        run: |
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS

      # Drafts are listed only to a token that can write, and gh finds one by its tag.
      - name: Draft the release
        working-directory: ${{ runner.temp }}/release
        run: |
          tag="v$VERSION"
          drafts=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$tag\") | .draft")
          case $drafts in
            '')
              set -- --draft --verify-tag --generate-notes --title "Lo $VERSION"
              [ "$PRERELEASE" = false ] || set -- "$@" --prerelease
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" "$@" -- ./*
              echo "::notice::Drafted $tag. Read it, then publish it."
              ;;
            true)
              gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber -- ./*
              echo "::notice::Replaced the files of $tag's draft."
              ;;
            *)
              echo "::error::$tag has a published release, or more than one, which a run never changes."
              exit 1
              ;;
          esac

  # Proposes a published release's Homebrew cask to withlo/homebrew-tap. It runs when a maintainer
  # publishes a release, or makes a prerelease one, and only for a release that is neither a draft
  # nor a prerelease, by the release's flags and by its tag. A version no newer than the cask on the
  # tap's main is left out, with a notice. Otherwise it downloads the two DMGs from the addresses
  # the cask names, checks each against the release's SHA256SUMS, renders Casks/lo.rb with
  # scripts/release/cask.sh, and opens a pull request on the tap from the branch lo-<version>. The
  # tap's checks audit and install the cask there, and a maintainer merges it. The version, and so
  # the branch and every file name, comes from the release's tag alone, through version.sh: never
  # from the release's name or notes. TAP_TOKEN, a token that can write only to the tap, comes from
  # the `tap` environment, and only the step that opens the pull request reads it, running gh alone.
  cask:
    name: cask
    needs: version
    if: >-
      github.event_name == 'release' && !github.event.release.draft &&
      !github.event.release.prerelease && needs.version.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: tap
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAP: withlo/homebrew-tap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `brew upgrade` takes any version other than the one installed as an update, so a release no
      # newer than the cask on the tap's main would take Homebrew's Lo back, or change nothing. The
      # cask's version is read as text, and must be a release's, as this job writes it. The tap is
      # public, so this reads it without TAP_TOKEN.
      - name: Compare with the tap's cask
        id: tap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! cask=$(gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$TAP/contents/Casks/lo.rb?ref=main" 2> /dev/null); then
            if printf '%s' "$cask" | jq -e '.status == "404"' > /dev/null 2>&1; then
              echo "$TAP's main has no cask yet, so $VERSION's is proposed."
              echo newer=true >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Can't read $TAP's cask: $cask"
            exit 1
          fi
          current=$(printf '%s\n' "$cask" | sed -n 's/^  version "\(.*\)"$/\1/p')
          if [ "$(printf '%s\n' "$current" | wc -l)" -ne 1 ] ||
            ! printf '%s\n' "$current" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::$TAP's cask has no single version of a release: $current"
            exit 1
          fi
          newest=$(printf '%s\n' "$current" "$VERSION" | sort -t . -k 1,1n -k 2,2n -k 3,3n |
            tail -n 1)
          if [ "$current" = "$VERSION" ] || [ "$newest" != "$VERSION" ]; then
            echo "::notice::$TAP's cask is at $current, so $VERSION's isn't proposed."
            echo newer=false >> "$GITHUB_OUTPUT"
          else
            echo "$TAP's cask is at $current, so $VERSION's is proposed."
            echo newer=true >> "$GITHUB_OUTPUT"
          fi

      # As anyone downloads them, from the addresses the cask names. Each must be listed in
      # SHA256SUMS with the SHA-256 it has, which is what the cask then holds.
      - name: Download the DMGs and check them against SHA256SUMS
        id: sums
        if: steps.tap.outputs.newer == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          mkdir dmgs
          cd dmgs
          fetch() {
            curl --fail --silent --show-error --location --proto '=https' --retry 3 --output "$1" \
              "https://github.com/withlo/lo/releases/download/v$VERSION/$1"
          }
          fetch SHA256SUMS
          for arch in arm64 x64; do
            name="Lo-$VERSION-$arch.dmg"
            fetch "$name"
            hash=$(sha256sum -- "$name" | cut -d ' ' -f 1)
            grep -qxF "$hash  $name" SHA256SUMS ||
              { echo "::error::SHA256SUMS doesn't list $name with its SHA-256, $hash."; exit 1; }
            echo "$name: $hash"
            echo "$arch=$hash" >> "$GITHUB_OUTPUT"
          done

      - name: Render the cask
        if: steps.tap.outputs.newer == 'true'
        env:
          ARM64: ${{ steps.sums.outputs.arm64 }}
          X64: ${{ steps.sums.outputs.x64 }}
        run: |
          sh scripts/release/cask.sh "$VERSION" "$ARM64" "$X64" > "$RUNNER_TEMP/lo.rb"
          cat "$RUNNER_TEMP/lo.rb"

      # Through GitHub's API, so the token never goes into git's config: the branch lo-<version>
      # from the tap's main, a commit on it that writes Casks/lo.rb, and a pull request, titled as
      # Homebrew titles a cask's update. A re-run reuses the branch and its pull request. A file's
      # blob SHA is git's hash of its contents, so comparing them compares the casks.
      - name: Open the pull request on the tap
        if: steps.tap.outputs.newer == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The tap environment has no TAP_TOKEN."
            exit 1
          fi
          branch="lo-$VERSION"
          file=Casks/lo.rb
          cask="$RUNNER_TEMP/lo.rb"
          want=$(git hash-object --no-filters -- "$cask")
          # The blob SHA of the cask on a branch, or nothing when it has none. gh prints GitHub's
          # answer when it's an error, and for a missing file that's a 404.
          blob() {
            if found=$(gh api "repos/$TAP/contents/$file?ref=$1" --jq .sha 2> /dev/null); then
              echo "$found"
            elif ! printf '%s' "$found" | jq -e '.status == "404"' > /dev/null 2>&1; then
              echo "::error::Can't read $file on $TAP's $1: $found" >&2
              return 1
            fi
          }

          main=$(gh api "repos/$TAP/git/ref/heads/main" --jq .object.sha) ||
            { echo "::error::$TAP has no main branch to propose the cask to."; exit 1; }
          on_main=$(blob main)
          title="lo $VERSION"
          [ -n "$on_main" ] || title="$title (new cask)"

          # A branch made here holds main's cask, which GitHub may not serve from it at once.
          if gh api "repos/$TAP/git/ref/heads/$branch" > /dev/null 2>&1; then
            on_branch=$(blob "$branch")
          else
            gh api -X POST "repos/$TAP/git/refs" -f "ref=refs/heads/$branch" -f "sha=$main" \
              > /dev/null
            on_branch=$on_main
          fi
          if [ "$on_branch" != "$want" ]; then
            set -- -f "message=$title" -f "content=$(base64 -w 0 < "$cask")" -f "branch=$branch"
            [ -z "$on_branch" ] || set -- "$@" -f "sha=$on_branch"
            gh api -X PUT "repos/$TAP/contents/$file" "$@" > /dev/null
          fi

          open=$(gh pr list --repo "$TAP" --head "$branch" --state open --json url \
            --jq '.[0].url // empty')
          if [ -n "$open" ]; then
            echo "::notice::$open has this cask."
            exit 0
          fi
          release="https://github.com/withlo/lo/releases/tag/v$VERSION"
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body=$(printf '%s\n\n%s\n' "The cask for Lo $VERSION: $release" \
            "Each DMG's SHA-256 is the one the release's SHA256SUMS lists. Opened by $run.")
          url=$(gh pr create --repo "$TAP" --base main --head "$branch" --title "$title" \
            --body "$body")
          echo "::notice::Opened $url. Merge it once its checks pass."
