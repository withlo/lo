# Saves pnpm's store, Electron's binary and the oldest git's build from main. A cache saved on a pull request's or the
# merge queue's ref is only visible to that ref, while one saved on main is visible to every pull
# request, so the other workflows only restore it.
name: cache

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pnpm-store:
    name: pnpm-store
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs from the lockfile and saves the store when its key isn't cached yet.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

  # The binary the electron package downloads, which the app job in ci.yml restores.
  electron:
    name: electron
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find Electron's version
        id: electron
        run:
          echo "version=$(jq -r .devDependencies.electron apps/desktop/package.json)" >>
          "$GITHUB_OUTPUT"

      - name: Look for this version's download
        id: cached
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ steps.electron.outputs.version }}
          lookup-only: true

      - if: steps.cached.outputs.cache-hit != 'true'
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          save-cache: false
          require-lockfile: true

      - name: Download Electron
        if: steps.cached.outputs.cache-hit != 'true'
        run: pnpm --filter @lo/desktop exec install-electron

      - if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ steps.electron.outputs.version }}

  # The build of the oldest git Lo takes, which the oldest-git job in ci.yml restores.
  oldest-git:
    name: oldest-git
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/oldest-git
        with:
          save: 'true'
