# Saves pnpm's store from main. A cache saved on a pull request's or the merge queue's ref is only
# visible to that ref, while one saved on main is visible to every pull request, so the other
# workflows only restore it.
name: cache

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pnpm-store:
    name: pnpm-store
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs from the lockfile and saves the store when its key isn't cached yet.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
