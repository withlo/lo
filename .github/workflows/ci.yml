name: ci

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # nx.json turns both off too. These also cover any token in the environment.
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'
  # The commits a pull request or a merge queue entry adds, between these two.
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}

jobs:
  # Changes that only touch docs, the brand's files, agent files or the license skip the check job,
  # which runs Nx and the repo checks. ci-ok passes when it's skipped. Formatting is checked either
  # way. scripts/changes.sh has the list.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      check: ${{ steps.filter.outputs.check }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether the check job runs
        id: filter
        run: sh scripts/changes.sh "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  commitlint:
    name: commitlint
    # Dependabot's commit bodies break commitlint's line-length limits. Its PR title, which becomes
    # the squash commit, is still checked by pr-title. The merge queue's commits are PR titles.
    if:
      github.event_name == 'pull_request' && github.event.pull_request.user.login !=
      'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Installs the Node and pnpm that package.json's devEngines pins, then the dependencies. Jobs
      # here only restore pnpm's store; cache.yml saves it from main, where every pull request
      # can read it.
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true
          save-cache: false
          require-lockfile: true

      - name: Lint the PR's commits
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  symlinks:
    name: symlinks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the agent symlinks
        run: sh scripts/check-symlinks.sh

  # ubuntu-latest ships shellcheck.
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the repo's shell scripts
        run: |
          shellcheck --version
          shellcheck scripts/*.sh scripts/hooks/*.sh scripts/release/*.sh brand/icon/build.sh testing/fixtures/*.sh \
            apps/desktop/build/linux/*.sh

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true
          save-cache: false
          require-lockfile: true

      - name: Check formatting
        run: pnpm format:check

  check:
    name: check
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The whole history, so Nx can compare against the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true
          save-cache: false
          require-lockfile: true

      - name: Check the TypeScript project references
        run: pnpm nx sync:check

      # Building the syntax package's grammars needs the WebAssembly toolchain its build downloads.
      # cache.yml saves it from main, so restore it when they're built.
      - name: Find whether the grammars are built
        id: grammars
        run: |
          affected=$(pnpm nx show projects --affected --json --base="$BASE_SHA" --head=HEAD)
          if printf '%s' "$affected" | jq -e 'index("syntax") != null' > /dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.grammars.outputs.build == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lo/tree-sitter
          key:
            tree-sitter-${{ runner.os }}-${{ hashFiles('packages/desktop/syntax/scripts/build.ts')
            }}

      # Against the checked-out commit: the pull request merged into its base, or the queue entry.
      - name: Lint, type check, test and build what changed
        run: >-
          pnpm nx affected -t lint typecheck test build --base="$BASE_SHA" --head=HEAD
          --output-style=static

      - name: Check the boundaries
        run: pnpm check:boundaries

      - name: Check that generated files are current
        run: pnpm check:generated

  # Builds the desktop app and runs its smoke test: Playwright driving the real app on Linux, with
  # Chromium's sandbox on, under a virtual display. Four jobs run it in parallel, each a shard of
  # every Playwright project's tests, and each builds what it tests. The list of shards must agree
  # with the 4 in the job's name and in its test step. A shard's failure fails app, and so ci-ok;
  # the others run on, so one run shows every failing test.
  app:
    name: app (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # The whole history, so Nx can compare against the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true
          save-cache: false
          require-lockfile: true

      # The electron package downloads its binary on first use. cache.yml saves the download from
      # main.
      - name: Find Electron's version
        id: electron
        run:
          echo "version=$(jq -r .devDependencies.electron apps/desktop/package.json)" >>
          "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ steps.electron.outputs.version }}

      - name: Install Electron
        run: pnpm --filter @lo/desktop exec install-electron

      # Ubuntu's AppArmor stops unprivileged user namespaces, which Chromium's sandbox needs.
      - name: Let Chromium's sandbox run
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # e2e depends on build, so this builds each app it tests first. The desktop smoke test starts
      # a virtual display for each Playwright worker (apps/desktop/e2e/display.ts), so the copies of
      # Lo two workers run at once never take focus from each other. The one xvfb-run starts serves
      # the ui and perf suites: by default Xvfb resets when its last client leaves, and a copy
      # starting just then finds no display. What follows -- goes to each project's Playwright, and
      # not to the builds. Playwright splits a project's tests by count, in file order. A project
      # with fewer tests than shards, such as ui's one spec file, leaves some shards with none of
      # them, which passes.
      - name: Build and run a shard of the smoke test
        run: >-
          xvfb-run -a -s '-screen 0 1920x1080x24 -noreset' pnpm nx affected -t e2e
          --base="$BASE_SHA" --head=HEAD --output-style=static -- --shard=${{ matrix.shard }}/4

      # One artifact per shard, and only on failure, so a passing run stores nothing.
      - name: Keep the smoke test's results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-test-results-${{ matrix.shard }}
          path: apps/desktop/test-results/
          retention-days: 7

  # @lo/git's tests with the oldest git Lo takes, 2.45, built from source: the runner's own is far
  # newer. They run when Nx finds @lo/git affected, which covers what it depends on, the lockfile
  # and the root configs its tests read, or when this job or the git it builds changes.
  oldest-git:
    name: oldest-git
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The whole history, so Nx can compare against the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true
          save-cache: false
          require-lockfile: true

      - name: Decide whether the tests run
        id: affected
        run: |
          if ! git diff --quiet "$BASE_SHA...$HEAD_SHA" -- .github/actions/oldest-git \
            .github/workflows/ci.yml .github/workflows/cache.yml; then
            echo "The job or the git it builds changed, so the tests run."
            echo run=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # They're skipped only when Nx's answers parse, name the project, and leave it out. jq -e
          # exits 1 for false, and something else for output it can't read.
          projects=$(pnpm -s nx show projects --json)
          affected=$(pnpm -s nx show projects --affected --base="$BASE_SHA" --head=HEAD --json)
          known=0
          echo "$projects" | jq -e 'any(. == "git")' > /dev/null || known=$?
          unaffected=0
          echo "$affected" | jq -e 'any(. == "git")' > /dev/null || unaffected=$?
          if [ "$known" -eq 0 ] && [ "$unaffected" -eq 1 ]; then
            echo "Nx finds @lo/git unaffected, so the tests don't run."
            echo run=false >> "$GITHUB_OUTPUT"
          else
            echo "Nx finds @lo/git affected, or can't say, so the tests run."
            echo run=true >> "$GITHUB_OUTPUT"
          fi

      - if: steps.affected.outputs.run == 'true'
        uses: ./.github/actions/oldest-git

      - name: Show the git the tests run
        if: steps.affected.outputs.run == 'true'
        run: |
          git --version
          command -v git

      - name: Test @lo/git
        if: steps.affected.outputs.run == 'true'
        run: pnpm --filter @lo/git test

  # Swift on Linux, for real, on Ubuntu 24.04: Lo's own code downloads the Swift toolchain
  # toolchains.json pins for it, checks it as Lo does, and starts the SourceKit-LSP in it as Lo
  # does, on the code fixture's Swift project, which must answer a hover, and write nothing in the
  # runner's home (packages/desktop/lsp/scripts/sourcekit.ts). It downloads over a gigabyte, so it
  # runs only when Swift's pins change, or anything the check runs does. Nothing comes from or goes
  # to a cache: pnpm/setup restores and saves one of its own, whatever it's told, so pnpm comes from
  # scripts/install-pnpm.sh, as in package.yml.
  swift:
    name: swift
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # The whole history, to compare against the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Swift's entries in toolchains.json, and everything else the check runs: this workflow, what
      # installs pnpm, Node and the dependencies (package.json, pnpm-workspace.yaml, the lockfile
      # and the two packages' own package.json), the check and its listing of the home, the source
      # of @lo/lsp and @lo/git, which it imports through their indexes, the scripts that make the
      # code fixture and every project in it, which they copy into the checkout the server reads.
      # Tests aren't run, so they don't count.
      - name: Decide whether the check runs
        id: changed
        run: |
          set -o pipefail
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          if ! git diff --quiet "$base" "$HEAD_SHA" -- \
            .github/workflows/ci.yml scripts/install-pnpm.sh \
            package.json pnpm-workspace.yaml pnpm-lock.yaml \
            packages/desktop/lsp/package.json packages/desktop/git/package.json \
            packages/desktop/lsp/scripts/sourcekit.ts packages/desktop/lsp/scripts/home.ts \
            packages/desktop/lsp/src packages/desktop/git/src \
            testing/fixtures/code.sh testing/fixtures/code-lib.sh \
            testing/fixtures/code \
            ':(exclude,glob)**/*.test.ts'; then
            echo "What the check runs changed, so it runs."
            echo run=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pins() {
            git show "$1:packages/desktop/lsp/toolchains.json" |
              jq -S 'with_entries(select(.key | startswith("swift-")))'
          }
          if before=$(pins "$base") && after=$(pins "$HEAD_SHA") && [ "$before" = "$after" ]; then
            echo "Neither Swift's pins nor what the check runs changed, so it doesn't run."
            echo run=false >> "$GITHUB_OUTPUT"
          else
            echo "Swift's pins changed, or can't be compared, so the check runs."
            echo run=true >> "$GITHUB_OUTPUT"
          fi

      # pnpm, as package.json pins it, checked against the SHA-512 pnpm-lock.yaml holds for it,
      # then the dependencies from the lockfile alone, with the Node package.json pins.
      - name: Install pnpm and the dependencies
        if: steps.changed.outputs.run == 'true'
        run: |
          sh scripts/install-pnpm.sh "$RUNNER_TEMP/pnpm"
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pnpm/pnpm" install --frozen-lockfile

      # Lo installs nothing on the system: it names the packages swift.org lists that are missing,
      # as the check does, and fails while any is.
      - name: Install the packages Swift needs
        if: steps.changed.outputs.run == 'true'
        run: |
          missing=$(pnpm --silent --filter @lo/lsp run sourcekit packages)
          if [ -z "$missing" ]; then
            echo "None is missing."
            exit 0
          fi
          echo "Missing: $(echo "$missing" | tr '\n' ' ')"
          sudo apt-get update
          echo "$missing" | xargs sudo apt-get install -y --no-install-recommends

      - name: Download Swift, start SourceKit-LSP and ask it for a hover
        if: steps.changed.outputs.run == 'true'
        run: pnpm --filter @lo/lsp run sourcekit

  # Fails when the overview checker's package, as this commit packs it, differs from npm's copy of
  # the same version, so a change to it comes with a new version, which merging publishes. Lo's
  # skill runs the checker by that version. It passes while npm hasn't got the version, so it only
  # installs and packs once npm has. scripts/overview-npm.sh does the work, as publish.yml does.
  overview:
    name: overview
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Look for this version on npm
        id: npm
        run: |
          lookup=$(sh scripts/overview-npm.sh lookup)
          echo "$lookup"
          echo "$lookup" >> "$GITHUB_OUTPUT"

      - if: steps.npm.outputs.published == 'true'
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true
          save-cache: false
          require-lockfile: true

      - name: Compare the package with npm's copy
        if: steps.npm.outputs.published == 'true'
        run: sh scripts/overview-npm.sh compare

  # Renders Lo's Homebrew cask with fixed values, as the release workflow's cask job renders a
  # release's, and checks it against Homebrew's rules with `brew style`, so a template Homebrew
  # would refuse fails here rather than in the tap's checks after a release. It runs when the
  # template, the script that renders it or this workflow changes.
  cask-style:
    name: cask-style
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The whole history, to compare against the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether the check runs
        id: changed
        run: |
          if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- scripts/release/lo.rb.in \
            scripts/release/cask.sh scripts/release/semver.sh .github/workflows/ci.yml; then
            echo "Neither the cask's template, its script nor this workflow changed, so it doesn't run."
            echo run=false >> "$GITHUB_OUTPUT"
          else
            echo "The cask's template, its script or this workflow changed, so it runs."
            echo run=true >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changed.outputs.run == 'true'
        uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1

      # In a Casks folder, where Homebrew's rules for casks apply, with cask.test.ts's values.
      - name: Render the cask and check its style
        if: steps.changed.outputs.run == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          sh scripts/release/cask.sh 0.1.0 \
            0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210 \
            > "$RUNNER_TEMP/tap/Casks/lo.rb"
          cat "$RUNNER_TEMP/tap/Casks/lo.rb"
          brew style "$RUNNER_TEMP/tap/Casks/lo.rb"

  # The one check to require besides pr-title, so adding jobs never changes the ruleset. Skipped
  # jobs pass. A job with a matrix, like app, has one result: failure if any of its jobs failed.
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      [
        changes,
        commitlint,
        symlinks,
        shellcheck,
        format,
        check,
        app,
        oldest-git,
        swift,
        overview,
        cask-style,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          exit 1
