name: ci

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # nx.json turns both off too. These also cover any token in the environment.
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'
  # The commits a pull request or a merge queue entry adds, between these two.
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}

jobs:
  # Changes that only touch docs, the brand's files, agent files or the license skip the check job,
  # which runs Nx and the repo checks. ci-ok passes when it's skipped. Formatting is checked either
  # way. scripts/changes.sh has the list.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      check: ${{ steps.filter.outputs.check }}
      git: ${{ steps.git.outputs.git }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether the check job runs
        id: filter
        run: sh scripts/changes.sh "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      # The oldest-git job runs only for changes to @lo/git, its test support, or the job itself.
      - name: Decide whether the oldest-git job runs
        id: git
        run: |
          changed=$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" -- \
            packages/desktop/git testing/src/git testing/fixtures/trees.sh \
            .github/actions/oldest-git .github/workflows/ci.yml)
          if [ -n "$changed" ]; then echo git=true; else echo git=false; fi >> "$GITHUB_OUTPUT"

  commitlint:
    name: commitlint
    # Dependabot's commit bodies break commitlint's line-length limits. Its PR title, which becomes
    # the squash commit, is still checked by pr-title. The merge queue's commits are PR titles.
    if:
      github.event_name == 'pull_request' && github.event.pull_request.user.login !=
      'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Installs the Node and pnpm that package.json's devEngines pins, then the dependencies. Jobs
      # here only restore pnpm's store; cache.yml saves it from main, where every pull request
      # can read it.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          save-cache: false
          require-lockfile: true

      - name: Lint the PR's commits
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  symlinks:
    name: symlinks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the agent symlinks
        run: sh scripts/check-symlinks.sh

  # ubuntu-latest ships shellcheck.
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the repo's shell scripts
        run: |
          shellcheck --version
          shellcheck scripts/*.sh scripts/hooks/*.sh brand/icon/build.sh

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          save-cache: false
          require-lockfile: true

      - name: Check formatting
        run: pnpm format:check

  check:
    name: check
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The whole history, so Nx can compare against the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          save-cache: false
          require-lockfile: true

      - name: Check the TypeScript project references
        run: pnpm nx sync:check

      # Building the syntax package's grammars needs the WebAssembly toolchain its build downloads.
      # cache.yml saves it from main, so restore it when they're built.
      - name: Find whether the grammars are built
        id: grammars
        run: |
          affected=$(pnpm nx show projects --affected --json --base="$BASE_SHA" --head=HEAD)
          if printf '%s' "$affected" | jq -e 'index("syntax") != null' > /dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.grammars.outputs.build == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lo/tree-sitter
          key:
            tree-sitter-${{ runner.os }}-${{ hashFiles('packages/desktop/syntax/scripts/build.ts')
            }}

      # Against the checked-out commit: the pull request merged into its base, or the queue entry.
      - name: Lint, type check, test and build what changed
        run: >-
          pnpm nx affected -t lint typecheck test build --base="$BASE_SHA" --head=HEAD
          --output-style=static

      - name: Check the boundaries
        run: pnpm check:boundaries

      - name: Check that generated files are current
        run: pnpm check:generated

  # Builds the desktop app and runs its smoke test: Playwright driving the real app on Linux, with
  # Chromium's sandbox on, under a virtual display.
  app:
    name: app
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The whole history, so Nx can compare against the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          save-cache: false
          require-lockfile: true

      # The electron package downloads its binary on first use. cache.yml saves the download from
      # main.
      - name: Find Electron's version
        id: electron
        run:
          echo "version=$(jq -r .devDependencies.electron apps/desktop/package.json)" >>
          "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ steps.electron.outputs.version }}

      - name: Install Electron
        run: pnpm --filter @lo/desktop exec install-electron

      # Ubuntu's AppArmor stops unprivileged user namespaces, which Chromium's sandbox needs.
      - name: Let Chromium's sandbox run
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # e2e depends on build, so this builds each app it tests first. One virtual display serves the
      # whole run: by default Xvfb resets when its last client leaves, and a copy of Lo starting
      # just then finds no display.
      - name: Build and run the smoke test
        run: >-
          xvfb-run -a -s '-screen 0 1920x1080x24 -noreset' pnpm nx affected -t e2e
          --base="$BASE_SHA" --head=HEAD --output-style=static

      - name: Keep the smoke test's results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-test-results
          path: apps/desktop/test-results/
          retention-days: 7

  # @lo/git's tests with the oldest git Lo takes, 2.45, built from source: the runner's own is far
  # newer.
  oldest-git:
    name: oldest-git
    needs: changes
    if: needs.changes.outputs.git == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/oldest-git

      - name: Show the git the tests run
        run: |
          git --version
          command -v git

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          save-cache: false
          require-lockfile: true

      - name: Test @lo/git
        run: pnpm --filter @lo/git test

  # The one check to require besides pr-title, so adding jobs never changes the ruleset. Skipped
  # jobs pass.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, commitlint, symlinks, shellcheck, format, check, app, oldest-git]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          exit 1
