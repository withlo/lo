# The squash commit on main uses the PR title, so it must pass the same commitlint rules as commits.
name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # The merge queue waits for every required check, so this workflow runs there too, and skips.
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    # The title was checked on the pull request. A skipped job counts as passing.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the Node and pnpm that package.json's devEngines pins, then the dependencies.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          save-cache: false
          require-lockfile: true

      - name: Lint the PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose
